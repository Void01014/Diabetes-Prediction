services:

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    environment:
      - PYTHONUTF8=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    command: python src/train.py
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUTF8=1
    volumes:
      - ./data:/app/data
    # one-shot: exits 0 on success, non-zero on failure
    restart: no

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUTF8=1

  streamlit:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000/predict

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - airflow-db:/opt/airflow/airflow-db
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow-db/airflow.db
      - DATA_DIR=/opt/airflow/data
      - MODELS_DIR=/opt/airflow/models
      - PYTHONUTF8=1
      # fixed credentials so you don't need to dig through logs
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin123
    command: airflow standalone
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  mlflow-data:
  airflow-db:
